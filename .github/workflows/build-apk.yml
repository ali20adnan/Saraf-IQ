# بناء Debug APK على GitHub (لا حاجة لـ Java على جهازك).
# بعد الدمج: GitHub → Actions → "Build Android APK" → Run workflow → تنزيل Artifact اسمه saraf-iq-debug
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Gradle assembleDebug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: saraf-iq-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
