# Debug APK فقط — assembleRelease يحتاج keystore غير موجود في CI
# بعد نجاح البناء على main/master: رفع تلقائي إلى Release بوسم continuous
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: saraf-iq-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "Artifacts → saraf-iq-debug.apk"

      - name: Publish APK to GitHub Release (main/master only)
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="continuous"
          REPO="${{ github.repository }}"
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          REF_NAME="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/apk/debug/app-debug.apk saraf-iq-debug.apk
          URL="https://github.com/${REPO}/releases/download/${TAG}/saraf-iq-debug.apk"
          NOTES="**بناء تلقائي من CI** — \`${SHORT_SHA}\` على \`${REF_NAME}\`.  **تنزيل:** [saraf-iq-debug.apk](${URL})"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "تحديث Release موجود: $TAG"
            gh release upload "$TAG" saraf-iq-debug.apk --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES" || true
          else
            echo "إنشاء Release: $TAG"
            gh release create "$TAG" saraf-iq-debug.apk \
              --repo "$REPO" \
              --title "Saraf IQ — آخر بناء (continuous)" \
              --notes "$NOTES" \
              --prerelease
          fi
          echo "OK → https://github.com/${REPO}/releases/tag/${TAG}"
